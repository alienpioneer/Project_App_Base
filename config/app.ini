# This file contains initialization data for the application

[ID]
equipement_id = 12345

[GRAPHICS]
WIDTH = 800
HEIGHT = 450
RESOLUTION_DIVIDER = 1
; Max fps for the GUI updates
MAX_FPS = 30 
; Impose a minimum period between draw calls so that the UI buffer is not overruned
MIN_PERIOD_FRAME_UPDATE = 5
; Linux DRM file name
drm_display_file = "/dev/dri/card0"
; Linux Input file for touch screen
drm_input_file = "/dev/input/event1"

[LVGL]
; The minimum distance in pixels for scoll
INDEV_SCROLL_LIMIT = 100
GESTURE_MIN_VELOCITY = 3
GESTURE_MIN_DISTANCE = 50
SHOW_CURSOR = true
; MIRROR THE TOUCH X AXIS
MIRROR_CURSOR_X_AXIS = false
; MIRROR THE TOUCH Y AXIS
MIRROR_CURSOR_Y_AXIS = false

[AUDIO]
; default hardware like "default", "hw:0,0" etc
audio_interface = "default"
; Change to "Master" if board lacks a PCM channel - usually PCM width DRM
audio_mixer = "PCM"
audio_alt_mixer = "Master"
; On virtual machine MAX_ALSA_BUFFER_SIZE = 32768;
MAX_ALSA_BUFFER_SIZE = 2048
; On virtual machine MAX_ALSA_PERIOD_SIZE = 8192;
MAX_ALSA_PERIOD_SIZE = 512

[BACKLIGHT]
; Backlight luminosity parameters
device_path = "/sys/class/backlight"
device_name = "edp_pwm_backlight"
brightness_name = "brightness"
max_brightness_name = "max_brightness"

[USERS]
; Map user level to 'hash:salt'. Maximim 10 user levels
admin = bccd1149f87dd734707059cdb003bb7ccccde5083933fee76d134f291e273764:10d269348ad38924fbea9680bc583e78 ; admin
